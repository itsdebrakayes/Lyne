# Dependency scanning for Lyne.
#
# Checklist item 7.2. Every package here ships or builds something that faces a
# user, so each gets its own ecosystem entry — a single root entry would miss
# them, because the repo has no npm workspace and each app carries its own
# lockfile.
#
# Grouped so a week of patch bumps arrives as one PR per app rather than
# fifteen. Majors stay ungrouped and separate: those are the ones that need a
# human to read a migration guide, and burying a react-router v6 -> v7 inside a
# batch of patches is how it gets merged without one.

version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      backend-patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  - package-ecosystem: npm
    directory: /apps/website
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      website-patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  - package-ecosystem: npm
    directory: /apps/admin-desktop
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      admin-patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  # Expo pins its own toolchain versions and resolves them as a set, so a lone
  # bumped transitive dep here is more likely to break the build than to fix
  # anything shipped. Security updates only; routine version drift is handled
  # by `expo install --fix` at SDK upgrade time instead.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      mobile-security:
        patterns: ["*"]
        update-types: ["patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
