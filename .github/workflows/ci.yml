name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: node --test

  admin-desktop:
    name: Admin desktop · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/admin-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  model:
    name: Model · unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pymysql
      - run: python -m unittest discover -s tests -v
