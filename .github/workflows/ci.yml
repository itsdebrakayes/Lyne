name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    name: Checks · corrections that fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin production:production || true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/checks/package-lock.json
      - run: npm --prefix tools/checks ci
      - run: npm --prefix tools/checks run check

  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: node --test

  admin-desktop:
    name: Admin desktop · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/admin-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  mobile:
    name: Mobile · typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm test

  model:
    name: Model · unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pymysql
      - run: python -m unittest discover -s tests -v
