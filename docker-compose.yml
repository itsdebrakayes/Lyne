
# ─────────────────────────────────────────────────────────────
#  LYNE — Docker Compose
#  Starts: MySQL 8 database + Node.js/Express backend API
#
#  Usage:
#    docker compose up -d          # start in background
#    docker compose logs -f api    # tail API logs
#    docker compose down -v        # stop and remove volumes
# ─────────────────────────────────────────────────────────────

services:

  # ── MySQL 8 ─────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: lyne_db
    restart: unless-stopped
    # The operational day is a LOCAL day. A container defaulting to UTC sits
    # five hours ahead of Jamaica, so from 7pm local every CURDATE() in the
    # backend rolls to tomorrow and today's queues, tickets and live screens
    # come back empty. Set APP_TZ per deployment; it must match the business.
    command: --default-time-zone=${APP_TZ:-America/Jamaica}
    environment:
      TZ: ${APP_TZ:-America/Jamaica}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-qme_now}
      MYSQL_USER:          ${MYSQL_USER:-lyne}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-lyne_secret}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-run production schema + migrations on first start.
      # Demo seed data belongs on the demo branch only.
      # One mount, not thirty. database/docker-init.sh walks migrations/ in
      # order, so a new migration needs no compose change. See that file.
      - ./database:/qme-sql:ro
      - ./database/docker-init.sh:/docker-entrypoint-initdb.d/00-qme-init.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lyne_net

  # ── Node.js / Express API ────────────────────────────────────
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: lyne_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ:                   ${APP_TZ:-America/Jamaica}
      NODE_ENV:             production
      PORT:                 4000
      MYSQL_HOST:           db
      MYSQL_PORT:           3306
      MYSQL_USER:           ${MYSQL_USER:-lyne}
      MYSQL_PASSWORD:       ${MYSQL_PASSWORD:-lyne_secret}
      MYSQL_DATABASE:       ${MYSQL_DATABASE:-qme_now}
      SUPABASE_URL:         ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      FRONTEND_URL:         ${FRONTEND_URL:-http://localhost:8080}
      ALLOWED_ORIGINS:      ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
    ports:
      - "4000:4000"
    networks:
      - lyne_net

  analytics-worker:
    profiles:
      - analytics
    build:
      context: ./apps/model
      dockerfile: Dockerfile
    container_name: lyne_analytics
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      MYSQL_HOST:             db
      MYSQL_PORT:             3306
      MYSQL_USER:             ${MYSQL_USER:-lyne}
      MYSQL_PASSWORD:         ${MYSQL_PASSWORD:-lyne_secret}
      MYSQL_DATABASE:         ${MYSQL_DATABASE:-qme_now}
      API_URL:                http://api:4000/api
      SUPABASE_URL:           ${SUPABASE_URL}
      SUPABASE_ANON_KEY:      ${SUPABASE_PUBLISHABLE_KEY}
      PIPELINE_EMAIL:         ${PIPELINE_EMAIL:-}
      PIPELINE_PASSWORD:      ${PIPELINE_PASSWORD:-}
      PIPELINE_BUSINESS_ID:   ${PIPELINE_BUSINESS_ID:-}
      PIPELINE_TIMEZONE:      ${PIPELINE_TIMEZONE:-America/Jamaica}
    volumes:
      - analytics_outputs:/app/outputs
      - analytics_exports:/app/data_exports
      - analytics_state:/app/state
    networks:
      - lyne_net

  # ── Adminer (optional DB GUI) ────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: lyne_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:8080"
    networks:
      - lyne_net
    profiles:
      - tools   # Only starts with: docker compose --profile tools up

# ── Volumes ──────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  analytics_outputs:
    driver: local
  analytics_exports:
    driver: local
  analytics_state:
    driver: local

# ── Networks ─────────────────────────────────────────────────
networks:
  lyne_net:
    driver: bridge
