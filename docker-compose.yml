
# ─────────────────────────────────────────────────────────────
#  Q ME NOW — Docker Compose
#  Starts: MySQL 8 database + Node.js/Express backend API
#
#  Usage:
#    docker compose up -d          # start in background
#    docker compose logs -f api    # tail API logs
#    docker compose down -v        # stop and remove volumes
# ─────────────────────────────────────────────────────────────

services:

  # ── MySQL 8 ─────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: qmenow_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-qme_now}
      MYSQL_USER:          ${MYSQL_USER:-qmenow}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-qmenow_secret}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-run production schema + migrations on first start.
      # Demo seed data belongs on the demo branch only.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/migrations/001_performance_indexes.sql:/docker-entrypoint-initdb.d/02_001_performance_indexes.sql:ro
      - ./database/migrations/002_security_and_ocr.sql:/docker-entrypoint-initdb.d/03_002_security_and_ocr.sql:ro
      - ./database/migrations/003_sessions_and_token_security.sql:/docker-entrypoint-initdb.d/04_003_sessions_and_token_security.sql:ro
      - ./database/migrations/004_pipeline_and_tenant_hardening.sql:/docker-entrypoint-initdb.d/05_004_pipeline_and_tenant_hardening.sql:ro
      - ./database/migrations/005_audit_tenant_scope.sql:/docker-entrypoint-initdb.d/06_005_audit_tenant_scope.sql:ro
      - ./database/migrations/006_roles_and_demo_auth_hardening.sql:/docker-entrypoint-initdb.d/07_006_roles_and_demo_auth_hardening.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - qmenow_net

  # ── Node.js / Express API ────────────────────────────────────
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: qmenow_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV:             production
      PORT:                 4000
      MYSQL_HOST:           db
      MYSQL_PORT:           3306
      MYSQL_USER:           ${MYSQL_USER:-qmenow}
      MYSQL_PASSWORD:       ${MYSQL_PASSWORD:-qmenow_secret}
      MYSQL_DATABASE:       ${MYSQL_DATABASE:-qme_now}
      SUPABASE_URL:         ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      FRONTEND_URL:         ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "4000:4000"
    networks:
      - qmenow_net

  analytics-worker:
    build:
      context: ./apps/model
      dockerfile: Dockerfile
    container_name: qmenow_analytics
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      MYSQL_HOST:             db
      MYSQL_PORT:             3306
      MYSQL_USER:             ${MYSQL_USER:-qmenow}
      MYSQL_PASSWORD:         ${MYSQL_PASSWORD:-qmenow_secret}
      MYSQL_DATABASE:         ${MYSQL_DATABASE:-qme_now}
      API_URL:                http://api:4000/api
      SUPABASE_URL:           ${SUPABASE_URL}
      SUPABASE_ANON_KEY:      ${SUPABASE_PUBLISHABLE_KEY}
      PIPELINE_EMAIL:         ${PIPELINE_EMAIL}
      PIPELINE_PASSWORD:      ${PIPELINE_PASSWORD}
      PIPELINE_BUSINESS_ID:   ${PIPELINE_BUSINESS_ID}
      PIPELINE_TIMEZONE:      ${PIPELINE_TIMEZONE:-America/Jamaica}
    volumes:
      - analytics_outputs:/app/outputs
      - analytics_exports:/app/data_exports
      - analytics_state:/app/state
    networks:
      - qmenow_net

  # ── Adminer (optional DB GUI) ────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: qmenow_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - qmenow_net
    profiles:
      - tools   # Only starts with: docker compose --profile tools up

# ── Volumes ──────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  analytics_outputs:
    driver: local
  analytics_exports:
    driver: local
  analytics_state:
    driver: local

# ── Networks ─────────────────────────────────────────────────
networks:
  qmenow_net:
    driver: bridge
