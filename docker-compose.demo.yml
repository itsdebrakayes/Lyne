# ─────────────────────────────────────────────────────────────
#  LYNE — Demo overlay
#
#  Adds a SECOND, fully seeded demo database alongside the clean
#  production database. The API is repointed at the demo database
#  so end-to-end testing never touches production data.
#
#    db       (port 3307) — clean production schema, real data lives here
#    demo-db  (port 3308) — schema + migrations + multi-business demo seed
#
#  Usage:
#    docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
#
#  Reset the demo database (init scripts only run on a fresh volume):
#    docker compose -f docker-compose.yml -f docker-compose.demo.yml down
#    docker volume rm lyne_mysql_demo_data
#    docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
# ─────────────────────────────────────────────────────────────

services:

  # ── Seeded demo MySQL ────────────────────────────────────────
  demo-db:
    image: mysql:8.0
    container_name: lyne_demo_db
    restart: unless-stopped
    # The operational day is a LOCAL day. Containers default to UTC, which puts
    # the database five hours ahead of Jamaica — so from 7pm local every
    # CURDATE() in the backend (48 of them) rolls to tomorrow and every "today"
    # query returns nothing. Pinning the timezone fixes all of them at once.
    command: --default-time-zone=${APP_TZ:-America/Jamaica}
    environment:
      TZ: ${APP_TZ:-America/Jamaica}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-lyne}
      MYSQL_USER:          ${MYSQL_USER:-lyne}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-lyne_secret}
      # Opt-in, and only here. Production leaves this unset so a customer's
      # first database comes up empty and sellable.
      LYNE_LOAD_DEMO_SEEDS: "true"
    ports:
      # Bound to the loopback interface, not 0.0.0.0.
      #
      # "3307:3306" publishes on every interface the host has, so on any machine
      # with a routable address — a laptop on cafe wifi, a cloud VM, a demo box
      # at a client site — the database was listening to the network, defended
      # only by a password that lives in a .env recoverable from git history.
      # Nothing outside this machine has ever needed to reach it: the API talks
      # to the container over the compose network, and local tooling connects
      # through 127.0.0.1.
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_demo_data:/var/lib/mysql
      # One mount, not thirty. database/docker-init.sh walks migrations/ in
      # order, so a new migration needs no compose change. See that file.
      - ./database:/lyne-sql:ro
      - ./database/docker-init.sh:/docker-entrypoint-initdb.d/00-lyne-init.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lyne_net

  # ── API runs against the demo database in demo mode ─────────
  api:
    depends_on:
      demo-db:
        condition: service_healthy
    environment:
      TZ: ${APP_TZ:-America/Jamaica}
      NODE_ENV:   development
      MYSQL_HOST: demo-db
      # Queues are per-day by design, so a demo box seeded yesterday shows
      # "closed" everywhere today. Re-seed the demo day just after midnight.
      # Demo overlay only — the production stack never sets this.
      ALLOW_DEMO_DATA_REFRESH: "true"
      # The counter's six-digit override, for demos and for a reviewer who has
      # no second phone to read a real code from.
      #
      # It lives in the DEMO overlay, not the base file, for the same reason
      # ALLOW_DEMO_DATA_REFRESH does: the production stack must have no way to
      # pass it at all. Adding it to .env alone does nothing — compose lists
      # environment keys explicitly, which is why the documented "set it in .env
      # and rebuild" never actually worked.
      STAFF_TEST_VERIFICATION_CODE: ${STAFF_TEST_VERIFICATION_CODE:-}
      DEMO_SEED_PATH: /seed/demo_active_seed.sql
      DEMO_CREDIT_UNION_SEED_PATH: /seed/demo_credit_union_seed.sql
      DEMO_SECTOR_SEED_PATH: /seed/demo_sector_seed.sql
    volumes:
      - ./database/demo_active_seed.sql:/seed/demo_active_seed.sql:ro
      - ./database/demo_credit_union_seed.sql:/seed/demo_credit_union_seed.sql:ro
      - ./database/demo_sector_seed.sql:/seed/demo_sector_seed.sql:ro

  # ── Live model worker: runs the six models against the demo DB on boot and
  #    every 2h, so predictive_results is produced by the models, not seeded.
  #    On a fresh/thin volume it first generates the realistic #43 history. ──
  model-worker:
    build:
      context: ./apps/model
    container_name: lyne_model_worker
    restart: unless-stopped
    depends_on:
      demo-db:
        condition: service_healthy
    environment:
      MYSQL_HOST:            demo-db
      MYSQL_PORT:            "3306"
      MYSQL_USER:            ${MYSQL_USER:-lyne}
      MYSQL_PASSWORD:        ${MYSQL_PASSWORD:-lyne_secret}
      MYSQL_DATABASE:        ${MYSQL_DATABASE:-lyne}
      MODEL_REFRESH_SECONDS: "7200"
      MODEL_HISTORY_DAYS:    "150"
    networks:
      - lyne_net

volumes:
  mysql_demo_data:
    driver: local
