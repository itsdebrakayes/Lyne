<!doctype html>
<html lang="en" style="background:#060d1c;color:#ffffff">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Lyne — Skip the Wait, Hold Your Spot From Your Phone</title>
    <meta name="description" content="Lyne lets you see how long the wait is and hold your spot from your phone, so you never have to stand around waiting again." />
    <meta name="author" content="Lyne" />

    <!--
      Absolute urls, written at build time.
      Every https://example.invalid below is replaced by VITE_SITE_URL in
      scripts/generate-sitemap.mjs. Canonical and og:url must be absolute — a
      relative canonical is ignored, and a card scraper cannot resolve one — and
      the source file cannot know the domain, so it is stamped in during build.
    -->
    <link rel="canonical" href="https://example.invalid/" />

    <!-- Say yes explicitly. Some crawlers treat a missing directive as a reason
         to be conservative about snippets and image previews. -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <meta name="theme-color" content="#060d1c" />

    <meta property="og:site_name" content="Lyne" />
    <meta property="og:title" content="Lyne — Skip the Wait" />
    <meta property="og:description" content="See the wait before you leave home, hold your spot from your phone, and keep your day moving." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.invalid/" />
    <meta property="og:locale" content="en_JM" />
    <meta property="og:image" content="https://example.invalid/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lyne — see the wait and hold your spot from your phone." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@getlyne" />
    <meta name="twitter:title" content="Lyne — Skip the Wait" />
    <meta name="twitter:description" content="See the wait before you leave home, hold your spot from your phone, and keep your day moving." />
    <meta name="twitter:image" content="https://example.invalid/og-cover.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Structured data — the part answer engines actually read.

      This site is a client-rendered SPA, so an assistant that does not execute
      JavaScript sees this <head> and an empty <div id="root">. Everything below
      is therefore written as literal markup rather than injected at runtime: it
      is the only description of the product that a non-rendering crawler gets,
      and it is what turns "what is Lyne" into a quotable answer instead of a
      guess made from the page title.

      Three graphs, doing three jobs: what the company is, what the product is,
      and the questions people actually type. Keep the FAQ answers self-contained
      — an answer engine quotes one, not the page around it.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://example.invalid/#organization",
          "name": "Lyne",
          "url": "https://example.invalid/",
          "logo": "https://example.invalid/favicon.svg",
          "description": "Lyne is a queue management and virtual line platform that lets people see live wait times and hold their place in line from their phone.",
          "areaServed": { "@type": "Country", "name": "Jamaica" },
          "sameAs": ["https://twitter.com/getlyne"]
        },
        {
          "@type": "WebSite",
          "@id": "https://example.invalid/#website",
          "url": "https://example.invalid/",
          "name": "Lyne",
          "publisher": { "@id": "https://example.invalid/#organization" },
          "inLanguage": "en"
        },
        {
          "@type": "SoftwareApplication",
          "name": "Lyne",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "iOS, Android, Web",
          "url": "https://example.invalid/",
          "publisher": { "@id": "https://example.invalid/#organization" },
          "description": "Lyne removes physical queues. Customers join a line from their phone, watch their position update live, and arrive when they are nearly up. Branches get live queue dashboards, wait-time forecasting, staff and counter management, and analytics.",
          "featureList": [
            "Live wait times before you leave home",
            "Join a queue remotely and hold your place",
            "Notifications when you are called",
            "Kiosk check-in for walk-in customers",
            "Live queue dashboard for branch staff",
            "Wait-time forecasting and demand prediction",
            "Staff, counter and service analytics"
          ],
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JMD" }
        },
        {
          "@type": "FAQPage",
          "@id": "https://example.invalid/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is Lyne?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Lyne is a queue management platform that replaces physical lines with a virtual one. You can see how long the wait is at a branch before you leave home, join the line from your phone, and get notified when it is nearly your turn."
              }
            },
            {
              "@type": "Question",
              "name": "How do I skip the line at a government office or bank?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "If the branch uses Lyne, you open the app, pick the branch and the service you need, and join the queue remotely. Your position updates live while you carry on with your day, and Lyne tells you when to head in."
              }
            },
            {
              "@type": "Question",
              "name": "What is a virtual queue system?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A virtual queue system lets customers hold a place in line without standing in it. Instead of a paper ticket and a waiting room, the queue lives on the customer's phone and on a live dashboard the branch staff work from."
              }
            },
            {
              "@type": "Question",
              "name": "What does Lyne give a branch or business?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Branches get a live view of every line and counter, wait-time forecasting, kiosk check-in for walk-ins, staff and service analytics, and alerts when a queue is heading for trouble so a supervisor can act before customers feel it."
              }
            },
            {
              "@type": "Question",
              "name": "Is Lyne available in Jamaica?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Lyne is built in Jamaica for Jamaican agencies, banks, credit unions and government offices, and is rolling out to branches now."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!--
      Boot diagnostic.

      A blank page is the least informative failure a deployed SPA can produce:
      the HTML arrived, so the server looks healthy, and everything that went
      wrong went wrong in a console nobody is looking at. On a laptop where F12
      is the volume key, "check devtools" is not a usable instruction either.

      This listens for the two ways the app can fail to start — a script or
      stylesheet that 404s, and an exception while the bundle evaluates — and
      prints what happened into the page itself. If React mounts, #root gets
      children and this never renders. It costs nothing when everything works.
    -->
    <script>
      (function () {
        var reported = false;

        function show(title, detail) {
          if (reported) return;
          var root = document.getElementById('root');
          if (!root || root.children.length) return;   // the app mounted; stay quiet
          reported = true;
          root.innerHTML =
            '<div style="font:14px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;' +
            'max-width:640px;margin:12vh auto;padding:0 24px;color:#e6ecf5">' +
            '<div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55">Lyne — the page could not start</div>' +
            '<h1 style="font-size:24px;margin:14px 0 10px;font-weight:700">' + title + '</h1>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;background:rgba(255,255,255,.06);' +
            'border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px;font-size:12.5px;margin:0 0 16px">' +
            detail + '</pre>' +
            '<div style="opacity:.7;font-size:13px">Send this text to whoever is deploying the site.</div>' +
            '</div>';
        }

        // A 404 on the bundle fires an error event on the element, which does
        // not bubble — so it has to be caught in the capture phase.
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
            show('A file the page needs was not found.',
                 'Could not load:\n' + (el.src || el.href) +
                 '\n\nThe server returned something other than the file. Usually the site is\n' +
                 'in a subfolder and the asset paths are absolute, or .htaccess is rewriting\n' +
                 'the bundle to index.html.');
          } else if (e.error) {
            show('The app crashed while starting.', String(e.error && e.error.stack || e.message));
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          show('The app crashed while starting.', String((e.reason && e.reason.stack) || e.reason));
        });

        // Nothing threw and nothing 404'd, but nothing rendered either.
        setTimeout(function () {
          show('The app loaded but did not render.',
               'No error was raised. This usually means the JavaScript bundle was served\n' +
               'as HTML — check that .htaccess exists next to index.html and that its\n' +
               'file/directory check comes before the catch-all rewrite.');
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
