<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The full icon set, so the brand appears wherever a surface asks for one:
         the SVG for modern browsers, the .ico because Safari and many feed
         readers still request /favicon.ico by path, PNGs for the sizes that
         ignore both, apple-touch-icon for iOS Add to Home Screen, and the
         manifest for Android and desktop install. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B1B3F" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The WORDMARK face. Cormorant Italic is what the logo is set in (SIL
         Open Font License, logos permitted), so the brand name is set in it
         wherever it appears as the brand. It is not a UI font: only .lyne-mark
         uses it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@1,600&display=swap" />
    <title>Lyne Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
