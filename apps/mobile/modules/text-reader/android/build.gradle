plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.textreader'
version = '1.0.0'

android {
  namespace "expo.modules.textreader"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Bundled Latin model: works offline and needs no Play Services download.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
